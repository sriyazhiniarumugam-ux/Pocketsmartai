<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<header class="navbar">

    <a
        class="brand"
        href="/"
    >
        PocketSmart
        <span>AI</span>
    </a>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/planner/home">
            Home Planner
        </a>

        <a href="/planner/party">
            Party Planner
        </a>

        <a href="/planner/jewelry">
            Jewelry Planner
        </a>

        <a href="/history">
            History
        </a>

        <a
            id="authLink"
            href="/login"
        >
            Login
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI

    ·

    Prices are estimates.
    Verify details on the
    destination platform.

</footer>


<script
    src="/static/js/app.js"
></script>


{% block scripts %}
{% endblock %}

</body>

</html>
