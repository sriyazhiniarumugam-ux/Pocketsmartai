{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <p class="eyebrow">
        WELCOME BACK
    </p>


    <h1>
        Sign in
    </h1>


    <form
        id="loginForm"
        class="form"
    >

        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
                minlength="6"
            >

        </label>


        <button
            class="btn primary"
            type="submit"
        >

            Login

        </button>


        <p
            id="formMessage"
            class="message"
        ></p>

    </form>


    <p>

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script
    src="/static/js/auth.js"
></script>

{% endblock %}
