{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <p class="eyebrow">
        START PLANNING
    </p>


    <h1>
        Create account
    </h1>


    <form
        id="registerForm"
        class="form"
    >

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
                minlength="6"
            >

        </label>


        <button
            class="btn primary"
            type="submit"
        >

            Register

        </button>


        <p
            id="formMessage"
            class="message"
        ></p>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script
    src="/static/js/auth.js"
></script>

{% endblock %}
